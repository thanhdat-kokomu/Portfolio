<!doctype html>
<html lang="vi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Dương Thành Đạt — Fullstack / Backend Developer. Xây dựng Web API ổn định với Spring Boot 3.x và giao diện mượt mà với Vue 3."
    />
    <meta name="theme-color" content="#0b0616" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dương Thành Đạt — Fullstack / Backend Developer" />
    <meta
      property="og:description"
      content="Portfolio kỹ thuật: ShopAo (E-Commerce & POS) và IKUS Task Manager (Spring Security + JWT)."
    />

    <title>Dương Thành Đạt — Fullstack / Backend Developer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script>
      // Resolve theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var dark = stored ? stored === 'dark' : true
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
